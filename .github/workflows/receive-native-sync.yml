name: receive-native-sync

on:
  repository_dispatch:
    types: [copilot-native-sync]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.central_repo }}
          ref: ${{ github.event.client_payload.central_ref }}
          token: ${{ secrets.CENTRAL_READ_PAT }}
          path: .central

      - name: Sync native instructions
        run: |
          chmod +x .central/scripts/sync-native-instructions.sh
          .central/scripts/sync-native-instructions.sh \
            "${{ github.event.client_payload.target_key }}" \
            ".central/config/repo-map.json" \
            "$PWD/.central" \
            "$PWD"

      - name: Create PR if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to sync"
            exit 0
          fi

          BRANCH="copilot-sync/shared-instructions"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "chore: sync native copilot instructions"
          git push --force origin "$BRANCH"

          if ! gh pr list --head "$BRANCH" --state open | grep -q .; then
            gh pr create \
              --title "chore: sync native copilot instructions" \
              --body "Automated sync from central review repository."
          fi